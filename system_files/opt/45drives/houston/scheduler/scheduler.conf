# Houston Scheduler Global Settings
# These values are applied when generating new task service files.
# Existing tasks can be migrated via the UI or by running:
#   python3 /opt/45drives/houston/scheduler/scripts/migrate-retry-settings.py

[retry]
# How long to wait before retrying a failed task (seconds)
restart_sec = 5
# Maximum retry attempts before giving up
start_limit_burst = 3
# NOTE: start_limit_interval_sec is auto-calculated as (burst + 1) * restart_sec
# to ensure the window is always large enough to capture all retry attempts.

[concurrency]
# Maximum tasks (ZFS replication, rsync) allowed to be connected to/
# transferring with the same remote host at once, across all task types.
# Tasks beyond this limit wait for a free slot instead of racing each other
# for SSH connections. Set to 0 to disable.
max_per_host = 3
